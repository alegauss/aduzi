name: Release setup

# QS377: the release setup built from the tag, on GitHub's runner and not on the maintainer's desk.
# A signing service that signs open-source projects for free (SignPath Foundation) signs only what a
# CI run of the public repository produced, checked against the repository, the commit and this
# workflow. An archive zipped on the desk cannot meet that, however reproducible it is.
#
# It builds and keeps the setup (QS393), and publishes nothing: publish-release.cmd still makes the GitHub
# release (QS371), and sending this run's setup to be signed is QS382. The performance gate is
# optional and means something only on the desk that took its baseline (QS79), so the build here is
# not -Gated, as CI's is not.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  archive:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # The SDK global.json names and no other (QS394): its patch decides the runtime a build
          # ships, and THIRD-PARTY-NOTICES.md lists that runtime at that version.
          global-json-file: global.json

      # The tag is the version's name, and the setup is named from the project: a tag that says
      # one version over a project that says another would ship a setup nobody can match to it.
      - name: Tag names the project's version
        shell: pwsh
        run: |
          $version = (dotnet msbuild src/Quickshell.App/Quickshell.App.csproj -nologo -getProperty:Version | Out-String).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Output "::error title=release::the tag is ${{ github.ref_name }}, and Directory.Build.props says $version - tag v$version, or change <Version> first"
            exit 1
          }
          "version=$version" >> $env:GITHUB_ENV

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Release setup (unsigned)
        run: .\release.cmd -Unsigned

      - name: Keep the setup
        uses: actions/upload-artifact@v7
        with:
          name: aduzi-${{ env.version }}
          path: artifacts/release/
          retention-days: 90
          if-no-files-found: error
